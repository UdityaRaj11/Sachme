# Source Credibility Scoring Weights Configuration
# These weights govern how the Source Credibility Engine computes 0-100 reliability scores.
# Weights must sum to 1.0 (or are normalized dynamically).

weights:
  tier_weight: 0.35 # Baseline tier weight (Tier 1 vs Tier 2 vs Tier 3)
  domain_reputation: 0.25 # Historical reputation & verification index of the domain
  relevance: 0.15 # Semantic & entity match between claim and source snippet
  primary_source_bonus: 0.10 # Is the source direct/first-party vs reporting hearsay
  recency: 0.08 # Freshness and temporal proximity to events
  corroboration: 0.07 # Agreement with other independent sources

tier_base_scores:
  tier_1_official: 90 # Government, official gazettes, regulatory bodies, primary scientific research
  tier_2_high_credibility: 75 # Established wire agencies, top-tier newspapers, verified fact-checkers, universities
  tier_3_general: 45 # General blogs, forums, social media, unverified news portals

